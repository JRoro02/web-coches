<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presupuesto - AutoElite</title>

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

<header>
    <div class="logo">
        <h1>AutoElite</h1>
    </div>

    <nav>
        <ul>
            <li><a href="index.html">Inicio</a></li>
            <li><a href="productos.html">Productos</a></li>
            <li><a href="presupuesto.html" class="activo">Presupuesto</a></li>
            <li><a href="contacto.html">Contacto</a></li>
        </ul>
    </nav>
</header>

<main>

    <h2>Solicitar Presupuesto</h2>

    <form>

        <label>Nombre:</label>
        <input type="text" name="nombre" required>

        <label>Email:</label>
        <input type="email" name="email" required>

        <label>Teléfono:</label>
        <input type="tel" name="telefono" required>

        <label>Solicite más información:</label>
        <textarea name="mensaje" rows="5" required></textarea>

        <div class="checkbox">
            <input type="checkbox" required>
            <label>Acepto la política de privacidad</label>
        </div>

        <button type="submit">Enviar</button>

    </form>

</main>

<footer>
    <p>© 2025 AutoElite</p>
    <p>Dirección: Calle Motor 123, Madrid</p>
    <p>Síguenos en redes sociales</p>
</footer>

</body>
</html>
